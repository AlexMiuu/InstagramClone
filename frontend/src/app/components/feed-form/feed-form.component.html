<div class="post-section">
  <div class="filter-bar">
    <p-button label="Reload Posts"
      icon="pi pi-refresh"
      styleClass="p-button-rounded p-button-outlined"
      (onClick)="loadPosts()"></p-button>
  </div>

  <div *ngFor="let post of posts" class="post-card">
    <div class="post-header">
      <div class="post-user-info">
        <p-avatar [label]="post.authorUsername.charAt(0)" shape="circle" size="large"></p-avatar>
        <div>
          <div class="post-username">{{ post.authorUsername }}</div>
          <div class="post-time">{{ post.createdAt | date:'medium' }}</div>
        </div>
      </div>
      <div class="post-actions" *ngIf="post.authorId === currentUserId">
        <button pButton icon="pi pi-pencil" class="p-button-text p-button-rounded" (click)="editPost(post)"></button>
        <button pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" (click)="confirmDeletePost(post)"></button>
      </div>
    </div>

    <img [src]="post.imageUrl || '/placeholder.svg?height=600&width=600&query=Instagram post'" alt="Post image" class="post-image">

    <div class="post-content">
      <div class.post-title>{{ post.title }}</div>
      <div class="post-text">{{ post.text }}</div>
      <div class="post-tags">
        <span *ngFor="let tag of post.tags" class="post-tag" (click)="filterByTag(tag)">
          #{{ tag.name }}
        </span>
      </div>
      <div class="post-status">Status: {{ post.status }}</div>
    </div>

    <div class="post-footer">
      <div class="post-stats">
        <div class="post-likes">{{ post.likes }} likes</div>
        <div class="post-comments-count" (click)="toggleComments(post)">
          {{ post.comments.length }} comments
        </div>
      </div>

      <div class="post-interaction">
        <button pButton icon="pi pi-heart" [ngClass]="{'liked': post.likerIds?.includes(currentUserId)}"
          class="p-button-text p-button-rounded" (click)="likePost(post)"></button>
        <button pButton icon="pi pi-comment" class="p-button-text p-button-rounded"
          (click)="toggleComments(post)"></button>
      </div>
    </div>

    <div class="post-comment-section" *ngIf="post.showComments">
      <div *ngFor="let comment of post.comments" class="post-comment">
        <p-inplace #inplace [style]="{'width': '100%'}">
          <ng-template pTemplate="display">
            <div class="comment-display-container">
              <div>
                <span class="post-comment-username">{{ comment.username }}</span>
                <span class="post-comment-text">{{ comment.text }}</span>
              </div>
            </div>
          </ng-template>
          <ng-template pTemplate="content">
            <div class="comment-edit-form-inplace">
              <input #editedCommentInput type="text" class="post-comment-input" [value]="comment.text" (keyup.enter)="inplace.deactivate(); editComment(comment, editedCommentInput.value)">
              <div class="comment-edit-actions">
                <button pButton icon="pi pi-check" class="p-button-rounded p-button-sm"
                  (click)="inplace.deactivate(); editComment(comment, editedCommentInput.value)"></button>
                <button pButton icon="pi pi-times" class="p-button-rounded p-button-text p-button-sm"
                  (click)="inplace.deactivate()"></button>
              </div>
            </div>
          </ng-template>
        </p-inplace>

        <div class="comment-footer">
          <div class="comment-votes">
            <button pButton icon="pi pi-chevron-up" class="p-button-text p-button-rounded p-button-sm" (click)="upvoteComment(comment)"></button>
            <span class="comment-score">{{ comment.score || 0 }}</span>
            <button pButton icon="pi pi-chevron-down" class="p-button-text p-button-rounded p-button-sm" (click)="downvoteComment(comment)"></button>
          </div>
          <button *ngIf="comment.userId === currentUserId" pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger p-button-sm" (click)="deleteComment(comment)"></button>
        </div>
      </div>

      <div class="post-comment-form">
        <input type="text" class="post-comment-input" [(ngModel)]="post.newComment"
          placeholder="Add a comment..." (keyup.enter)="addComment(post)">
        <button pButton icon="pi pi-send" class="p-button-rounded"
          (click)="addComment(post)"></button>
      </div>
    </div>
  </div>
</div>
