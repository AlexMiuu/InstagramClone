<app-feed-form-header></app-feed-form-header>

<div class="profile-container">



  <div class="profile-container simplified">
    <!-- Loading State -->
    <div *ngIf="loading" class="loading-spinner">
      <p-progressSpinner styleClass="w-8rem h-8rem" strokeWidth="4"></p-progressSpinner>
      <p>Loading profile...</p>
    </div>

    <!-- Loaded State - User Data Available -->
    <div *ngIf="!loading && user" class="profile-card-container">
      <p-card styleClass="profile-card">
        <ng-template pTemplate="header">
          <div class="profile-avatar-wrapper">
            <p-avatar
              [image]="user.profileImage"
              size="xlarge"
              shape="circle"
              [label]="!user.profileImage && user.username ? user.username.charAt(0).toUpperCase() : undefined"
              styleClass="profile-avatar-large"
            ></p-avatar>
          </div>
        </ng-template>

        <div class="profile-info">
          <div class="info-item">
            <span class="info-label">Username:</span>
            <span class="info-value username">{{ user.username }}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Email:</span>
            <span class="info-value email">{{ user.email }}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Score:</span>
            <span class="info-value score">{{ user.score }}</span>
          </div>
        </div>
      </p-card>
    </div>

    <!-- Loaded State - User Data Not Available / Error -->
    <div *ngIf="!loading && !user" class="profile-card-container">
       <p-card styleClass="profile-card">
          <div class="profile-info">
              <p>Could not load user profile.</p>
          </div>
       </p-card>
    </div>
  </div>
